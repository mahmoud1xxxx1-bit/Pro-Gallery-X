name: Android CI
on:
  push:
    branches: [main, 'ci/**', 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Setup Canonical Debug Keystore from Secret
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Installing canonical signing keystore from repository secrets..."
            mkdir -p ~/.android
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            test -s ~/.android/debug.keystore
            echo "Canonical keystore successfully installed."
          else
            echo "WARNING: SIGNING_KEYSTORE_BASE64 secret is not defined in this workflow run."
          fi
      - name: Verify versioning properties
        run: |
          test -f version.properties
          grep -q "VERSION_BUILD=" version.properties
          grep -q "VERSION_NAME=" version.properties
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK integrity, signature and package metadata
        run: |
          DIST_DIR=app/build/outputs/apk/distribution
          test -d "$DIST_DIR"
          APK=$(ls -1 $DIST_DIR/ProGalleryX-*-debug.apk | head -n 1)
          test -s "$APK"
          echo "Verifying $APK"

          # 1. Verify Android package metadata
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.progalleryx.app'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt

          # 2. Verify APK signature schemes and print certificates
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-certs.txt

          # 3. Mandatory CI Quality Gate: Enforce Canonical Certificate Fingerprint
          EXPECTED_SHA256="c1ea4285c43ccc6da990b93e9a323494609aaa68dbe2d1f500c24c3d6956c1f6"
          ACTUAL_SHA256=$(grep "Signer #1 certificate SHA-256 digest:" apk-certs.txt | head -n 1 | awk '{print $6}')
          echo "Expected Certificate SHA-256: $EXPECTED_SHA256"
          echo "Actual Certificate SHA-256:   $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::CRITICAL SIGNING ERROR: APK certificate ($ACTUAL_SHA256) does not match the canonical project key ($EXPECTED_SHA256)!"
            echo "::error::Distribution builds must strictly be signed with the canonical signing key."
            exit 1
          fi
          echo "SIGNATURE POLICY CHECK PASSED: Certificate SHA-256 strictly matches canonical key."

          # 4. Verify ZIP archive integrity
          unzip -t "$APK" | tail -1

          # 5. Generate SHA-256 checksum file
          sha256sum "$APK" > "$DIST_DIR/SHA256SUMS"
          cat "$DIST_DIR/SHA256SUMS"
      - name: Upload Versioned Distribution APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGalleryX-Debug-Artifacts
          path: |
            app/build/outputs/apk/distribution/*
