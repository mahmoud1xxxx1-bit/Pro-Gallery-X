name: Android CI
on:
  push:
    branches: [main, 'ci/**', 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify versioning properties
        run: |
          test -f version.properties
          grep -q "VERSION_BUILD=" version.properties
          grep -q "VERSION_NAME=" version.properties
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK integrity, signature and package metadata
        run: |
          DIST_DIR=app/build/outputs/apk/distribution
          test -d "$DIST_DIR"
          APK=$(ls -1 $DIST_DIR/ProGalleryX-*-debug.apk | head -n 1)
          test -s "$APK"
          echo "Verifying $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.progalleryx.app'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          unzip -t "$APK" | tail -1
          sha256sum "$APK" > "$DIST_DIR/SHA256SUMS"
          cat "$DIST_DIR/SHA256SUMS"
      - name: Upload Versioned Distribution APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProGalleryX-Debug-Artifacts
          path: |
            app/build/outputs/apk/distribution/*
